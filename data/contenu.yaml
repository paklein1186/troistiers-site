# Contenus éditoriaux du site, repris de la maquette « Trois-Tiers, le site » (novembre 2026).
# Ce fichier se modifie sans toucher au code : chaque liste alimente une page.
# « a_completer » = information manquante, affichée comme telle sur le site (jamais inventée).
# Les listes « agenda » et « projets » seront remplacées par ChangeTheGame (événements et quêtes de la guilde).

chiffres:
  - { fort: Depuis 2024, texte: prestataire de la Région wallonne }
  - { fort: Une vingtaine, texte: de lieux lauréats accompagnés }
  - { fort: Une quarantaine, texte: de membres }
  - { fort: 10 étapes, texte: de parcours d'accompagnement }

# Accueil : « Qui êtes-vous ? ». Chaque profil propose trois directions et une action.
profils_accueil:
  - id: porteur
    libelle: Porteur de projet
    titre: Vous portez un projet de lieu
    texte: Une idée, un collectif, parfois déjà un bâtiment. La première étape consiste à savoir si le projet tient, pour qui, et avec quel argent.
    directions:
      - { titre: Le parcours d'accompagnement, texte: "De l'amorce au lancement, en dix étapes dont on n'active que l'utile.", lien: /instruments#activateurs }
      - { titre: Rencontrer des pairs, texte: "D'autres porteurs sont passés par là. Les rendez-vous Tiers à Tiers servent à ça.", lien: /communaute }
      - { titre: Financer et sécuriser, texte: "Subsides, coopérateurs, foncière : les pistes pour votre montage.", lien: /instruments#fonds }
    action: { texte: Décrire mon projet avec Space2, lien: "https://space2.streamlit.app/" }
  - id: lieu
    libelle: Représentant d'un lieu
    titre: Vous faites vivre un lieu
    texte: Votre lieu existe et vous cherchez à le consolider, à trouver des ressources ou à échanger avec d'autres équipes.
    directions:
      - { titre: La communauté apprenante, texte: "Rencontres, visites, codéveloppement entre lieux.", lien: /communaute }
      - { titre: Besoins et ressources, texte: "Dites ce qui vous manque et ce que vous pouvez apporter.", lien: /instruments#numerique }
      - { titre: Foncier et financement, texte: "Sécuriser vos murs et trouver un capital patient.", lien: /instruments#foncier }
    action: { texte: Présenter mon lieu avec Space2, lien: "https://space2.streamlit.app/" }
  - id: territorial
    libelle: Acteur territorial
    titre: Vous agissez pour un territoire
    texte: "Association, réseau, opérateur de formation, agence de développement : les lieux peuvent devenir vos relais sur le terrain."
    directions:
      - { titre: Activateurs et animateurs, texte: "Des personnes formées pour mobiliser un territoire autour d'un lieu.", lien: /instruments#activateurs }
      - { titre: Les programmes en cours, texte: "Éducation des adultes, culture et économie sociale, coopérations européennes.", lien: /communaute#programmes }
      - { titre: Études et outils, texte: "Ce que le réseau a déjà documenté.", lien: /ressources }
    action: { texte: Proposer une coopération, lien: /contact }
  - id: public
    libelle: Acteur public
    titre: Vous représentez une commune, une région, une institution
    texte: "Un bâtiment communal sous-utilisé, une friche, une politique à ancrer localement. Nous accompagnons déjà une vingtaine de lieux lauréats pour la Région wallonne."
    directions:
      - { titre: Accompagner un lieu sur votre territoire, texte: "Du coup de sonde des acteurs à la structure qui portera le lieu.", lien: /instruments#activateurs }
      - { titre: Les lieux comme infrastructure, texte: "Notre vision et ce que nous portons auprès des décideurs.", lien: /trois-tiers }
      - { titre: Études disponibles, texte: "Dont « Tiers-lieux et pouvoirs publics ».", lien: /ressources }
    action: { texte: Parler de votre territoire, lien: /contact }
  - id: entreprise
    libelle: Entreprise
    titre: Votre entreprise veut s'ancrer dans son territoire
    texte: "Investir, mettre des compétences ou des locaux à disposition, s'associer à un lieu proche de vos sites : il existe plusieurs façons d'en être."
    directions:
      - { titre: Investir dans les lieux, texte: "La foncière coopérative et les véhicules d'investissement.", lien: /instruments#foncier }
      - { titre: Apporter des ressources, texte: "Compétences, espaces, équipements : la base besoins et ressources.", lien: /instruments#numerique }
      - { titre: Comprendre notre démarche, texte: "Pourquoi les lieux comptent pour un territoire.", lien: /trois-tiers }
    action: { texte: Rencontrer l'équipe, lien: /contact }

