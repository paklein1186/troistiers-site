# Configuration des membranes de Trois-Tiers.
#
# Ce fichier décrit la communauté comme des DONNÉES : profils, badges,
# espaces et règles d'accès. Les pages le lisent ; aucune règle d'accès
# n'est codée en dur. Le même format servira au futur configurateur de
# communauté apprenante (ChangeTheGame et studio).
#
# Identifiants : en minuscules, stables. Ne jamais renommer un identifiant
# déjà utilisé (comptes, badges et historiques y font référence).
#
# Niveaux d'accès, du plus fermé au plus ouvert :
#   aucun   : l'espace est invisible
#   resume  : titre, résumé, personnes (part publique)
#   agrege  : chiffres et synthèses, sans le détail
#   filtre  : le détail, limité à son territoire ou à ses missions
#   complet : tout le détail

version: 1

communaute:
  id: trois-tiers
  nom: Trois-Tiers
  source_comptes: changethegame   # CTG est maître des comptes, badges et cotisations
  guilde_ctg: null                # identifiant de la guilde Trois-Tiers, à renseigner
  devise: EUR

badges:
  adherent:       { libelle: Adhérent,       attribue_par: cotisation, duree: 12 mois }
  actif:          { libelle: Actif,          attribue_par: mission,    expire_avec: mission, portees: [projet, territoire] }
  effectif:       { libelle: Effectif,       attribue_par: gouvernance }
  equipe:         { libelle: Équipe,         attribue_par: coordination }
  administrateur: { libelle: Administrateur, attribue_par: ag }

profils:
  public:
    libelle: Grand public
    cotisation: null
    badges: []
  observateur:
    libelle: Observateur
    description: "A rejoint la guilde Trois-Tiers sur ChangeTheGame sans cotiser."
    cotisation: null
    badges: []
  citoyen:
    libelle: Citoyen soutenant
    cotisation: { annuel: 60, mensuel: 5 }
    badges: [adherent]
  accompagnant_freelance:
    libelle: Accompagnant freelance
    cotisation: { annuel: 100 }
    badges: [adherent]
  accompagnant_organisation:
    libelle: Organisation d'accompagnement
    cotisation: { base: 100, par_personne_supplementaire: 50 }
    payeur_distinct: true          # la structure paie, chaque personne porte son badge
    badges: [adherent]
  partenaire_allie:
    libelle: Partenaire allié
    cotisation: { annuel: 350 }
    badges: [adherent]
  partenaire_beneficiaire:
    libelle: Partenaire bénéficiaire
    cotisation: { base: 350, par_lieu_porte: { moins_de_20_usagers: 60, a_partir_de_20_usagers: 100 } }
    payeur_distinct: true          # peut payer l'adhésion de lieux de son territoire
    badges: [adherent]
  lieu:
    libelle: Lieu
    cotisation: { moins_de_20_usagers: 60, a_partir_de_20_usagers: 100 }
    badges: [adherent]
  financeur:
    libelle: Financeur ou investisseur
    cotisation: { pourcentage_des_soutiens: a_fixer }
    badges: []
  equipe:
    libelle: Équipe coordination
    cotisation: null
    badges: [equipe, effectif]
  oa:
    libelle: Administrateur (OA)
    cotisation: selon_autre_profil
    badges: [effectif, administrateur]

# Chaque espace déclare qui y accède et à quel niveau. Le niveau retenu pour
# une personne est le plus ouvert parmi les règles qui la concernent.
espaces:
  vitrine:
    libelle: Vitrine
    groupe: public
    acces: { tous: complet }
  missions_en_cours:
    libelle: Nos missions en cours
    groupe: public
    acces: { tous: resume, badges: { adherent: filtre, equipe: complet } }
  lieux_a_soutenir:
    libelle: Lieux à soutenir
    groupe: public
    source: space2
    acces: { tous: complet }
  carte:
    libelle: Carte des lieux
    groupe: public
    source: space2
    acces: { tous: complet }
  fiche_lieu:
    libelle: Fiche d'un lieu
    groupe: public
    source: space2
    # Visiteurs et observateurs : nom, commune, catégories, résumé bref. Membres : toute la synthèse publique Space2.
    acces: { tous: resume, badges: { adherent: complet, equipe: complet, actif: complet } }
  fiche_lieu_interne:
    libelle: Synthèse interne d'un lieu
    groupe: public
    source: space2
    # Décision de PA du 27/11 : la synthèse faite de toutes les réponses (confidentielles comprises), jamais les réponses
    # brutes ni les sources, pour les membres actifs au minimum. Fermée côté Space2 tant que SITE_LIEUX_INTERNE n'est pas posé.
    acces: { tous: aucun, badges: { actif: complet, effectif: complet, equipe: complet, administrateur: complet } }
  observatoire:
    libelle: Observatoire
    groupe: public
    source: space2
    acces: { tous: agrege, badges: { actif: filtre, equipe: complet } }
  commun:
    libelle: Commun
    groupe: membre
    acces: { badges: { adherent: complet, equipe: complet }, profils: { financeur: filtre } }
  communaute_apprenante:
    libelle: Communauté apprenante
    groupe: membre
    lien: guilde_ctg
    acces: { badges: { adherent: complet, equipe: complet }, profils: { observateur: resume } }
  nourrir_lieu:
    libelle: Nourrir votre lieu (entretien et enquêtes Space2)
    groupe: membre
    source: space2
    acces: { badges: { adherent: complet, equipe: complet, actif: complet }, profils: { observateur: complet } }
  bibliotheque:
    libelle: Bibliothèque (questions à l'assistant Space2)
    groupe: membre
    source: space2
    acces: { badges: { adherent: complet, equipe: complet, actif: complet } }
  groupes_travail:
    libelle: Groupes de travail
    groupe: membre
    sur_inscription: true
    acces: { badges: { adherent: filtre, equipe: filtre } }
  cle_territoire:
    libelle: Territoire
    groupe: cle
    portee: territoire
    acces: { badges: { actif: filtre, equipe: complet, administrateur: agrege } }
  cle_projet:
    libelle: Projet / mission
    groupe: cle
    portee: projet
    acces: { badges: { actif: filtre, equipe: complet, administrateur: agrege } }
  # Outils de l'espace membres : chaque outil est un espace comme les autres (lien + règles d'accès).
  # Lien « /outils/… » : copie synchronisée d'un artefact, servie par le site derrière ces mêmes règles
  # (data/artefacts/sources.yaml). Lien claude.ai : ne s'ouvre que pour qui l'artefact est partagé.
  outil_guilde_ctg:
    libelle: La guilde Trois-Tiers sur ChangeTheGame
    groupe: outil
    lien: "https://changethegame.xyz/guilds/4964c699-4684-43a9-b508-cee21c77e24e"
    description: "Quêtes, besoins et ressources, discussions de la communauté."
    acces: { badges: { adherent: complet, equipe: complet }, profils: { observateur: complet } }
  outil_space2:
    libelle: Space2
    groupe: outil
    lien: "https://space2.streamlit.app/"
    description: "L'entretien qui dresse le profil d'un lieu, la bibliothèque du réseau et la cartographie."
    acces: { badges: { adherent: complet, equipe: complet } }
  outil_configurateur:
    libelle: Configurateur AMO
    groupe: outil
    lien: /outils/configurateur-amo
    description: "Compose un parcours d'accompagnement et son budget à partir de la situation du porteur."
    acces: { badges: { equipe: complet }, profils: { accompagnant_freelance: complet, accompagnant_organisation: complet } }
  outil_referentiel:
    libelle: Portefeuille d'accompagnement — référentiel AMO
    groupe: outil
    lien: /outils/referentiel-amo
    description: "Le référentiel des prestations d'accompagnement."
    acces: { badges: { equipe: complet }, profils: { accompagnant_freelance: complet, accompagnant_organisation: complet } }
  outil_charte_accompagnants:
    libelle: Charte et guide du réseau d'accompagnants
    groupe: outil
    lien: /outils/charte-accompagnants
    description: "Les règles de fonctionnement du réseau d'accompagnants."
    acces: { badges: { equipe: complet }, profils: { accompagnant_freelance: complet, accompagnant_organisation: complet } }
  outil_coordination_missions:
    libelle: Cadre de coordination des missions
    groupe: outil
    # Lien à fournir par PA : https://claude.ai/artifact/P3NbXUrnYHznAQ3jQZAbsa ouvre une page étrangère (« Slides »).
    description: "Comment les missions se coordonnent entre l'équipe et les accompagnants."
    acces: { badges: { equipe: complet, actif: complet }, profils: { accompagnant_freelance: complet, accompagnant_organisation: complet } }
  outil_pilote:
    libelle: Pilote 3/3
    groupe: outil
    lien: "https://claude.ai/artifact/WchYGZ2spfyvMZPbPMx8XW"
    description: "Le cockpit de coordination de l'équipe : missions, pistes, chantiers, comptes rendus."
    acces: { badges: { equipe: complet } }
  outil_pilote_pivot:
    libelle: Pilote du pivot Trois-Tiers
    groupe: outil
    lien: "https://claude.ai/artifact/RcZEBMU2c59bKQfdYQXFcu"
    description: "Le pilotage stratégique du pivot de l'association."
    acces: { badges: { equipe: complet, administrateur: complet } }
  equipe:
    libelle: Équipe coordination
    groupe: gouvernance
    acces: { badges: { equipe: complet, administrateur: agrege } }
  oa:
    libelle: OA
    groupe: gouvernance
    acces: { badges: { administrateur: complet }, profils: { financeur: aucun } }

assistants:
  public:   { questions_par_mois: 5 }          # exemple, à fixer
  adherent:
    inclus_par_mois: 50                         # questions à la bibliothèque Space2 par personne et par mois (décision du 19/11)
    poids: { rapide: 1, equilibre: 1, approfondi: 3 }   # une question « profonde » (Opus) en vaut 3 (décision du 20/11)
  # Packs payants en euros (décision du 20/11) : 50 questions 5 €, 200 questions 15 €, sans limite de durée.
  # Contenu et prix gérés dans ChangeTheGame (guild_credit_packs) ; page /membre/bibliotheque/packs.

# Correspondance entre les formules de cotisation de la guilde Trois-Tiers sur
# ChangeTheGame (identifiant de formule) et les profils de ce site.
correspondances_ctg:
  formules:
    citoyen: citoyen
    citoyen_mensuel: citoyen
    accompagnant_freelance: accompagnant_freelance
    accompagnant_organisation: accompagnant_organisation
    partenaire_allie: partenaire_allie
    partenaire_beneficiaire: partenaire_beneficiaire
    lieu_moins_20: lieu
    lieu_20_et_plus: lieu
  # Comment chaque formule se présente sur la page « Adhérer » : le libellé du choix, et les
  # quantités à demander (extra_persons, small_places, large_places, comme dans guild-euro-checkout).
  # Les montants ne sont pas répétés ici : CTG les recalcule toujours à partir de la formule.
  choix:
    citoyen:                   { libelle: Par an }
    citoyen_mensuel:           { libelle: Par mois }
    accompagnant_freelance:    { libelle: Par an }
    accompagnant_organisation:
      libelle: Par an
      quantites: { extra_persons: Personnes en plus de la première }
    partenaire_allie:          { libelle: Par an }
    partenaire_beneficiaire:
      libelle: Par an
      quantites:
        small_places: Lieux portés de moins de 20 usagers réguliers
        large_places: Lieux portés de 20 usagers réguliers ou plus
    lieu_moins_20:             { libelle: Moins de 20 usagers réguliers }
    lieu_20_et_plus:           { libelle: 20 usagers réguliers ou plus }
